<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dear Love ❤️</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top left, #2b002b, #0b0010 70%);
    color: #ffd1dc;
    font-family: "Noto Sans Bengali", "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    text-align: center;
  }

  h1 {
    font-size: 2.8em;
    color: #ff85b3;
    margin-bottom: 30px;
    text-shadow: 0 0 10px #ff69b4;
    z-index: 2;
  }

  #lyrics {
    font-size: 1.3em;
    white-space: pre-wrap;
    line-height: 1.8em;
    max-width: 90%;
    z-index: 2;
    transition: opacity 1s ease;
  }

  .heart {
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); color: #ffb6c1; }
    50% { transform: scale(1.3); color: #ff69b4; }
    100% { transform: scale(1); color: #ffb6c1; }
  }

  /* Floating hearts */
  .floating-heart {
    position: fixed;
    bottom: -10px;
    color: #ff7eb3;
    opacity: 0.7;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    z-index: 1;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
  }

  .play-btn {
    background: #ff7eb3;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 1em;
    cursor: pointer;
    transition: background 0.3s;
    z-index: 2;
  }

  .play-btn:hover {
    background: #ff4f8b;
  }

  #ending {
    display: none;
    margin-top: 20px;
    font-size: 1.8em;
    color: #ffb6c1;
    text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
    z-index: 2;
    opacity: 0;
    animation: glowPulse 2s infinite alternate ease-in-out;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 10px #ff4f8b, 0 0 20px #ff4f8b; }
    100% { text-shadow: 0 0 25px #ff69b4, 0 0 45px #ff1493; }
  }

  audio { display: none; }
</style>
</head>
<body>

<h1>My Dear Love <span class="heart">❤️</span></h1>
<div id="lyrics"></div>
<div id="ending">For My Dear Dodo 💖</div>

<audio id="bg-music" loop>
  <source src="https://cdn.pixabay.com/audio/2023/03/14/audio_3025d2cbf7.mp3" type="audio/mpeg">
</audio>

<button class="play-btn" id="startBtn">Play & Begin 💕</button>

<script>
const lyrics = [
  "যদি বিরহ থাকে আমিও থাকি নী...",
  "কে বলো শেষ হবে আগে?....",
  "কেন যে এত ভালোবাসা মরে যায়.. ",
  "শুধু সময় মনে রাখে...",
  "এত শূন্যতা .... এ মনে রাখি যে আমি...",
  "দেখে না কেউ তো আর, বলে এসবই পাগলামি....",
  "কাটে না যামিনী, বিরহ যেন কেটে যায়....",
  "থামে না বরষা, তোমারে ডাকি যে আমি..."
];

const delays = [300, 1900, 1200, 900, 900, 200, 500, 700];
const lyricsDiv = document.getElementById("lyrics");
const startBtn = document.getElementById("startBtn");
const endingDiv = document.getElementById("ending");
const music = document.getElementById("bg-music");

// Typewriter + fade effect
async function typeText(text, speed = 100) {
  lyricsDiv.style.opacity = "0";
  await new Promise(r => setTimeout(r, 500)); // fade out
  lyricsDiv.innerHTML = "";
  lyricsDiv.style.opacity = "1";

  for (let char of text) {
    lyricsDiv.innerHTML += char;
    await new Promise(r => setTimeout(r, speed));
  }
}

// Sequential lyric display
async function showLyrics() {
  startBtn.style.display = "none";
  await new Promise(r => setTimeout(r, 1000));
  for (let i = 0; i < lyrics.length; i++) {
    await typeText(lyrics[i]);
    await new Promise(r => setTimeout(r, delays[i]));
  }

  // Final glowing text
  setTimeout(() => {
    endingDiv.style.display = "block";
    endingDiv.style.opacity = "1";
  }, 1500);
}

// Floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.textContent = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 5 + Math.random() * 3 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 600);

startBtn.addEventListener("click", () => {
  music.play();
  showLyrics();
});
</script>
</body>
</html>
