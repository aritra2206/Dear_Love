<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Love ❤️</title>
<style>
  body {
    background-color: #0b0b0b;
    color: #ffb6c1;
    font-family: "Noto Sans Bengali", "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    flex-direction: column;
  }

  h1 {
    font-size: 2.5em;
    color: #ff7eb3;
    margin-bottom: 30px;
  }

  #lyrics {
    font-size: 1.3em;
    white-space: pre-wrap;
    line-height: 1.8em;
  }

  .heart {
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); color: #ffb6c1; }
    50% { transform: scale(1.2); color: #ff69b4; }
    100% { transform: scale(1); color: #ffb6c1; }
  }
</style>
</head>
<body>

<h1>Long Distance Love <span class="heart">❤️</span></h1>
<div id="lyrics"></div>

<script>
const lyrics = [
  "যদি বিরহ থাকে আমিও থাকি নী...",
  "কে বলো শেষ হবে আগে?....",
  "কেন যে এত ভালোবাসা মরে যায়.. ",
  "শুধু সময় মনে রাখে...",
  "এত শূন্যতা .... এ মনে রাখি যে আমি...",
  "দেখে না কেউ তো আর, বলে এসবই পাগলামি....",
  "কাটে না যামিনী, বিরহ যেন কেটে যায়....",
  "থামে না বরষা, তোমারে ডাকি যে আমি..."
];

const delays = [300, 1900, 1200, 900, 900, 200, 500, 700];
const lyricsDiv = document.getElementById("lyrics");

async function typeText(text, speed = 110) {
  for (let char of text) {
    lyricsDiv.innerHTML += char;
    await new Promise(r => setTimeout(r, speed));
  }
  lyricsDiv.innerHTML += "\n";
}

async function showLyrics() {
  await new Promise(r => setTimeout(r, 1000));
  for (let i = 0; i < lyrics.length; i++) {
    await typeText(lyrics[i]);
    await new Promise(r => setTimeout(r, delays[i]));
  }
}

showLyrics();
</script>
</body>
</html>
